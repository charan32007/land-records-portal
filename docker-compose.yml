services:
  db:
    image: postgis/postgis:16-3.4
    container_name: land_spatial_db
    restart: always
    environment:
      POSTGRES_DB: land_records_db
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-adminpassword}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d land_records_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: land_record_api
    restart: always
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://admin:${POSTGRES_PASSWORD:-adminpassword}@db:5432/land_records_db
      - JWT_SECRET=${JWT_SECRET:?set JWT_SECRET in your .env file}
      - GEMINI_API_KEY=${GEMINI_API_KEY:?set GEMINI_API_KEY in your .env file}

  app:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: land_record_app
    restart: always
    depends_on:
      - api
    ports:
      - "8501:8501"
    environment:
      - API_BASE_URL=http://api:8000

volumes:
  pgdata: